<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>
  <text x="50%" y="54%" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="200" font-weight="900" fill="white" filter="url(#glow)">
    <tspan fill="white">KELI</tspan><tspan fill="url(#textGrad)">26</tspan>
  </text>
  <circle cx="420" cy="92" r="18" fill="#06B6D4" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="18;22;18" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>